name: nightly

on:
  schedule:
    - cron: '30 19 * * *' # 01:00 IST
  workflow_dispatch:

permissions: {}

jobs:
  zap-baseline:
    name: OWASP ZAP baseline DAST (staging)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Placeholder
        run: |
          echo "ZAP baseline runs against staging once the API is deployed (P2+)."
          echo "Intentionally a no-op in P0: no staging environment exists yet."

  authz-matrix:
    name: Authorisation matrix tests
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: '10.18.3'
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @saath/api run test:authz

  redteam-prompts:
    name: Red-team prompt suite (agents)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
      - run: cd services/agents && uv run pytest evals/redteam -q
