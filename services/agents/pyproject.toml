[project]
name = "saath-agents"
version = "0.0.0"
description = "Saath AI agents (A1-A11), LLM Gateway client, schemas, evals (DESIGN.md Â§6-7)"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "httpx>=0.28.1",

    "pydantic>=2.9",
    "uvicorn>=0.32",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pip-audit>=2.7",
]

[tool.pytest.ini_options]
testpaths = ["tests", "evals"]
pythonpath = ["."]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/saath_agents"]
