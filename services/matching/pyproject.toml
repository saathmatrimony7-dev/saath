[project]
name = "saath-matching"
version = "0.0.0"
description = "Saath matching pipeline: retrieval, ranking, nightly batch (DESIGN.md §8)"
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.9",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pip-audit>=2.7",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/saath_matching"]
